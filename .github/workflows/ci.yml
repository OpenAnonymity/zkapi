name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  app-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install SDK test dependencies
        run: npm ci

      - name: Test SDK and package both network asset sets
        run: |
          npm test
          node --test docker/aws/run-daemon.test.mjs
          npm run build:browser
          npm run build:mainnet

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Build app crates
        run: cargo build --release --workspace

      - name: Test app crates
        run: cargo test --release --workspace

      - name: Verify proofs from the shipped browser WASM
        run: cargo run --release --manifest-path protocol/rust/Cargo.toml -p zkapi-proof --example wasm_roundtrip -- "$PWD/scripts/prove-browser-fixture.mjs" "$PWD/sdk"

      - name: Clippy app crates
        run: cargo clippy --workspace -- -D warnings

      - name: Validate operator scripts
        run: bash -n scripts/build-browser-client.sh docker/tee/attestation-hook.sh && sh -n docker/aws/run-daemon.sh

  protocol-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy protocol Rust workspace
        run: cargo clippy --manifest-path protocol/rust/Cargo.toml --workspace -- -D warnings

      - name: Test protocol Rust workspace
        run: cargo test --release --manifest-path protocol/rust/Cargo.toml --workspace -- --test-threads=1

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check the generated Poseidon library
        run: node scripts/generate-poseidon.mjs --check

      - name: Forge build
        working-directory: protocol/contracts
        run: forge build

      - name: Forge test
        working-directory: protocol/contracts
        run: forge test -vvv

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t ethereum/zkapi:ci .
