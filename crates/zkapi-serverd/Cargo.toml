[package]
name = "zkapi-serverd"
description = "zkAPI server daemon: proof verification, nullifier storage, API execution, and state signing"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
zkapi-types = { path = "../../protocol/rust/crates/zkapi-types" }
zkapi-core = { path = "../../protocol/rust/crates/zkapi-core" }
zkapi-proof = { path = "../../protocol/rust/crates/zkapi-proof" }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
fs2 = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
sha2 = "0.10"
subtle = "2.6"
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
uuid = { workspace = true }
tempfile = { workspace = true }
zkapi-browser = { path = "../../protocol/rust/crates/zkapi-browser" }
